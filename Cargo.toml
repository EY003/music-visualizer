[package]
name = "music_visualizer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29.1"
egui = "0.29.1"
cpal = "0.15.3"
rustfft = "6.2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
color-thief = "0.2.2"
windows = { version = "0.58", features = [
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }
rodio = "0.19"
tokio = { version = "1.0", features = ["full"] }
